spring:
  jackson:
    time-zone: Asia/Seoul

  datasource:
    # Compose 기본값. SPRING_DATASOURCE_* 환경변수로 덮어쓸 수 있음.
    # .env에 SPRING_DATASOURCE_URL= 처럼 빈 값이 있으면 부팅 실패하므로 placeholder 사용 안 함.
    # Compose 내부망: SSL 없이 접속 (pg_hba "no encryption" 오류 방지)
    url: jdbc:postgresql://postgres:5432/myimagelog?sslmode=disable
    username: myimagelog
    password: myimagelog
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false

  h2:
    console:
      enabled: false

logging:
  level:
    root: INFO
