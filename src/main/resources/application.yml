server:
  port: 8080
  address: 0.0.0.0
  forward-headers-strategy: framework
spring:
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 50MB

  datasource:
    url: jdbc:h2:file:./data/myimagelog;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:your-google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:your-google-client-secret}
            scope: profile, email
          kakao:
            client-id: ${KAKAO_CLIENT_ID:your-kakao-rest-api-key}
            client-secret: ${KAKAO_CLIENT_SECRET:}
            scope: profile_nickname, profile_image
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/kakao"
            client-authentication-method: client_secret_post
            client-name: Kakao
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

app:
  upload:
    base-dir: uploads
    # 외부에서 접근 가능한 base URL (배포 시 SERVER_URL=https://api.lovelyju.com)
    public-url-base: ${SERVER_URL:http://localhost:8080}/files
  n8n:
    webhook-url: http://localhost:5678/webhook/fetch-news
  # OAuth / JWT
  api-base-url: ${SERVER_URL:} # 비우면 http://localhost:{port}. 앱/에뮬레이터용: http://10.0.2.2:8080
  oauth:
    redirect-uri: myimagelogapp://auth   # Kotlin 앱 딥링크
  jwt:
    secret: myimagelogserver-jwt-secret-key-min-32chars-long   # 배포 시 반드시 변경 필요!
    expiration-ms: 86400000   # 24시간

logging:
  level:
    root: INFO
    com.imglog.myimagelogserver: DEBUG